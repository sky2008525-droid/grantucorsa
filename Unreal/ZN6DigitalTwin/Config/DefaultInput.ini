; ===========================================================================
; ZN6 の運転操作 — アナログ機器（ゲームパッド / ハンドル / シフター）
; ---------------------------------------------------------------------------
; 追加日 2026-09-02。設計の根拠と未検証項目は **`Docs/INPUT_DEVICES.md`** に書いた。
;
; **実機（DualSense / T300RS / TH8A）が手元に無い。**
; ここに書いた割り当てのうち、実際に動かして確かめられたものは1つも無い。
; エンジンのソースを読んで裏を取った範囲と、取れていない範囲の区別は
; `Docs/INPUT_DEVICES.md` §0 の表にある。**「対応した」とは書かない。**
;
; この節の分類:
;   [A] UE 標準で動く見込み（プラグイン不要）
;   [B] プラグインが要る（RawInput / GameInput）。**既定では無効**
;   [C] **受け手が C++ に無い。押しても何も起きない。** 実装の目印として置いてある
; ===========================================================================

; ---------------------------------------------------------------------------
; [A] XInput 互換ゲームパッド
; ---------------------------------------------------------------------------
; XInputDevice プラグインは "EnabledByDefault": true
;   （UE_5.8/Engine/Plugins/Runtime/Windows/XInputDevice/XInputDevice.uplugin）
; なので、XInput として見えるパッドはプラグイン追加なしで動くはずである。
;
; **DualSense は Windows では XInput デバイスではない**（HID として見える）。
; そのまま挿しても下の Gamepad_* は鳴らない。Steam Input などで
; Xbox 互換にエミュレートさせる必要がある。詳細は INPUT_DEVICES.md §2。
;
; トリガは 0..1、スティックは -1..1 で来る。**キーボードと違って踏み込み量がある。**
; ところが AZN6VehicleActor::ApplyDriverInput はキーボード用の平滑化を
; 常に掛ける。**アナログ入力では入力が鈍る。** INPUT_DEVICES.md §5 に
; 必要な C++ 変更を書いた（設定だけでは直せない）。
+AxisMappings=(AxisName="ZN6_Throttle",Scale=1.000000,Key=Gamepad_RightTriggerAxis)
+AxisMappings=(AxisName="ZN6_Brake",Scale=1.000000,Key=Gamepad_LeftTriggerAxis)
; 既存のキーボード割り当ては A/Left が +1、D/Right が -1。**左が正。**
; スティックを右に倒すと Gamepad_LeftX は +1 になるので、符号を反転させる。
+AxisMappings=(AxisName="ZN6_Steer",Scale=-1.000000,Key=Gamepad_LeftX)
; クラッチとサイドはボタンで 0/1。**半クラッチはパッドでは出せない。**
; 物理側（FControlInput::Clutch）は 0..1 の連続値を受け取れるので、
; これは操作機器の制約であって物理の制約ではない。
+AxisMappings=(AxisName="ZN6_Clutch",Scale=1.000000,Key=Gamepad_FaceButton_Left)
+AxisMappings=(AxisName="ZN6_Handbrake",Scale=1.000000,Key=Gamepad_FaceButton_Bottom)
+ActionMappings=(ActionName="ZN6_ShiftUp",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_RightShoulder)
+ActionMappings=(ActionName="ZN6_ShiftDown",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_LeftShoulder)
+ActionMappings=(ActionName="ZN6_Reset",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_FaceButton_Top)

; ZN6_Menu をパッドへ。
;
; **これを割り当てる前に SZN6Menu::OnKeyDown を直した。**
; メニューを開くと AZN6VehicleActor::SyncInputModeToMenu が
; FInputModeUIOnly に切り替え、以後 Pawn の ActionMapping は発火しない。
; 閉じる操作は SZN6Menu::OnKeyDown が受けるが、そこはキーボードのキーしか
; 見ていなかったので、**パッドで開くとパッドでは閉じられない**画面が
; できていた。今は Gamepad_DPad_* / Gamepad_LeftStick_* /
; Gamepad_FaceButton_Bottom(×) / Gamepad_FaceButton_Right(○) /
; Gamepad_Special_Right(Options) を受ける。
+ActionMappings=(ActionName="ZN6_Menu",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_Special_Right)

; 視点の切り替え（追従 -> ボンネット -> 運転席 -> バンパー）。
; **押すたびに1つ回る。** 視点ごとにキーを割り当てると、4つとも
; 覚えないと使えない。
+ActionMappings=(ActionName="ZN6_CameraNext",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=C)
+ActionMappings=(ActionName="ZN6_CameraNext",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_RightThumbstick)

; ---------------------------------------------------------------------------
; [A] スティックの不感帯を操舵向けに詰める
; ---------------------------------------------------------------------------
; ファイル冒頭の +AxisConfig は Gamepad_LeftX に DeadZone=0.25 を与えている。
; 操舵の1/4が死ぬのは運転には広すぎる。**後から書いた entry が勝つ**ので、
; ここで上書きする（UInputSettings::PopulateAxisConfigs が同名 entry を
; 後勝ちで1つに畳む: Engine/Private/UserInterface/InputSettings.cpp:121-136）。
;
; **0.12 という数値に出典は無い。操作系の都合であって車両仕様ではない**
; （憲法ルール18）。スティックのへたりで直進が流れるなら上げること。
+AxisConfig=(AxisKeyName="Gamepad_LeftX",AxisProperties=(DeadZone=0.120000,Sensitivity=1.000000,Exponent=1.000000,bInvert=False))

; ---------------------------------------------------------------------------
; [B] GameInput プラグインのレーシングホイール軸
; ---------------------------------------------------------------------------
; UE 5.8 の GameInput プラグインは RacingWheel 用のキーを持つ
;   （Engine/Plugins/Runtime/GameInput/.../GameInputKeyTypes.cpp:9-22）。
; 値域は GameInputRacingWheelState に従い wheel が -1..1、
; throttle / brake / clutch / handbrake が 0..1。
;
; **既定では無効。** 使うには3つとも要る:
;   1. ZN6DigitalTwin.uproject で GameInput プラグインを有効化
;   2. UGameInputPlatformSettings::bProcessRacingWheel を true
;      （**既定 false**。GameInputDeveloperSettings.h:422。Experimental と明記されている）
;   3. RacingWheelDeadzone を 0 付近へ。**既定は 7849/32768 = 0.2395**
;      （同 425 行）。**操舵の 24% が死ぬ。**
; 2 と 3 は UPlatformSettings（perObjectConfig）なので、この DefaultInput.ini
; ではなくプラットフォーム別の設定に入る。INPUT_DEVICES.md §3.2 を見ること。
;
; **T300RS がこの経路で見えるかは未確認。** Windows のレーシングホイール
; 抽象は GIP / XUSB のホイールを前提にしており、T300RS は DirectInput/HID
; である。**見えない公算が高い**が、実機が無いので断定しない。
; 有効化しなければ、これらのキーは存在しないので単に発火しない（害は無い）。
+AxisMappings=(AxisName="ZN6_Throttle",Scale=1.000000,Key=GameInput_RacingWheel_Throttle)
+AxisMappings=(AxisName="ZN6_Brake",Scale=1.000000,Key=GameInput_RacingWheel_Brake)
+AxisMappings=(AxisName="ZN6_Steer",Scale=-1.000000,Key=GameInput_RacingWheel_Wheel)
; クラッチはハンドル側が 0..1（踏むと 1）。ApplyDriverInput が 1-x で反転して
; 物理の「0=切 / 1=繋」に直す。**キーボードの LeftShift と同じ向き。**
+AxisMappings=(AxisName="ZN6_Clutch",Scale=1.000000,Key=GameInput_RacingWheel_Clutch)
+AxisMappings=(AxisName="ZN6_Handbrake",Scale=1.000000,Key=GameInput_RacingWheel_Handbrake)
; シーケンシャルのパドル / レバー。**相対変速なので今の C++ でそのまま動く。**
+ActionMappings=(ActionName="ZN6_ShiftUp",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=GameInput_RacingWheel_NextGear)
+ActionMappings=(ActionName="ZN6_ShiftDown",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=GameInput_RacingWheel_PreviousGear)

; ---------------------------------------------------------------------------
; [C] H パターンシフター — **絶対位置。今の C++ は受け取れない。**
; ---------------------------------------------------------------------------
; ZN6_ShiftUp / ZN6_ShiftDown は「1段上げる / 1段下げる」という**相対**の命令で、
; AZN6VehicleActor::ShiftUp() が Control.GearIndex を +1 するだけである
; （ZN6VehicleActor.cpp:1426-1435）。
;
; H パターンのシフターが伝えてくるのは「今 3速の位置にレバーがある」という
; **絶対**の情報である。相対の口に絶対の情報は入らない。**噛み合わない。**
;
; 下の割り当ては **C++ に受け手が無いので現時点では何も起きない。**
; 必要な変更（AZN6VehicleActor::SetGearAbsolute と、ニュートラル・リバースを
; 持たない FControlInput::GearIndex の扱い）は INPUT_DEVICES.md §4 にある。
;
; **キーボードにも同じ名前を割り当ててある。** 実機が無くても、C++ を足した
; 人がその場で絶対変速を確かめられるようにするため。
+ActionMappings=(ActionName="ZN6_Gear1",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=One)
+ActionMappings=(ActionName="ZN6_Gear2",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Two)
+ActionMappings=(ActionName="ZN6_Gear3",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Three)
+ActionMappings=(ActionName="ZN6_Gear4",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Four)
+ActionMappings=(ActionName="ZN6_Gear5",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Five)
+ActionMappings=(ActionName="ZN6_Gear6",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Six)
+ActionMappings=(ActionName="ZN6_GearReverse",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Zero)
+ActionMappings=(ActionName="ZN6_GearNeutral",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=N)
; GameInput 経由の絶対ギア。int をそのまま float で流す軸で、
; **-1 が R、0 が N、1 以上が前進段**（Windows のレーシングホイール仕様）。
; これも受け手が無い。
+AxisMappings=(AxisName="ZN6_GearAbsolute",Scale=1.000000,Key=GameInput_RacingWheel_PatternShifterGear)

; ---------------------------------------------------------------------------
; [B] RawInput プラグイン（T300RS / TH8A を素の HID として読む経路）
; ---------------------------------------------------------------------------
; **軸番号を推測で書かない**（憲法ルール1・2）。T300RS の何番目の軸が
; ハンドルでどれがペダルかは、資料によって食い違っており確定できなかった。
; **実機で `showdebug RawInput` を出して読み取ってから埋めること。**
; 手順は INPUT_DEVICES.md §3.1 にある。
;
; 下は**雛形。コメントのままでは何も起きない。**
; VendorID / ProductID / 軸番号を実機の値に置き換え、行頭の ";" を外す。
; ペダルは多くの機器で「離した状態が 1」で来る。RawInput の正規化は
;   非スティック: v/(max-min) を bInverted なら符号反転し、Offset を足す
;   （RawInputWindows.h の FAnalogData::GetValue）
; なので、**反転しているペダルは bInverted=True と Offset=1.0 の両方**が要る。
; ハンドルは中心が 0 であってほしいので bGamepadStick=True にする。
;
; [/Script/RawInput.RawInputSettings]
; +DeviceConfigurations=(VendorID="0x044F",ProductID="0x____",AxisProperties=((bEnabled=True,Key=GenericUSBController_Axis1,bInverted=False,bGamepadStick=True,Offset=0.0),(bEnabled=True,Key=GenericUSBController_Axis2,bInverted=True,bGamepadStick=False,Offset=1.0)),ButtonProperties=((bEnabled=True,Key=GenericUSBController_Button1)))
; bRegisterDefaultDevice=True
;
; 雛形を有効にしたら、対応する軸を ZN6_* へ繋ぐ（これもコメントのまま）:
; +AxisMappings=(AxisName="ZN6_Steer",Scale=1.000000,Key=GenericUSBController_Axis1)
; +AxisMappings=(AxisName="ZN6_Throttle",Scale=1.000000,Key=GenericUSBController_Axis2)
;
; **RawInput は UE 5.8 で非推奨になっている**
;   （"DeprecatedEngineVersion": "5.8" — RawInput.uplugin）。
; 新しく足すなら GameInput 側を先に試すこと。
;
; **RawInput はフォースフィードバックを出せない。**
; FRawInputWindows::SetChannelValue / SetChannelValues は中身が空の
; `{}` である（RawInputWindows.h:259-260）。**呼んでも何も起きない。**
