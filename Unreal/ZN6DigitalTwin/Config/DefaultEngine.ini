[/Script/Engine.RendererSettings]
; **静的ライティングを使わない。**
;
; 有効なままだと、527 個の StaticMeshActor に対して
;   「ライティングを再ビルドする必要があります(527 個のビルドされていない
;     オブジェクト)」
; が画面に出続ける。ライトマップを焼けば消えるが、
;
;   - 樹木 525 本ぶんのライトマップ UV とベイクに長時間かかる
;   - このコースは Lumen（動的GI）で照らしており、**焼いた結果は使われない**
;
; ので、焼くのではなく静的ライティングを切るのが正しい。
r.AllowStaticLighting=False

; 動的GIと反射を Lumen に固定する。**既定に頼らない。**
; UE のバージョンで既定が変わると、絵が黙って変わる。
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
r.SkinCache.CompileShaders=1

; **ハードウェアレイトレーシングを切る。**
;
; 有効なままだと、峠（樹木 4307 本）で
;   「RAY TRACING GEOMETRY - ALWAYS RESIDENT MEMORY EXCEEDS 20% OF THE
;     BUDGET (311 MiB / 400 MiB)」
; が画面に赤字で出続ける。**画面に出る警告を握りつぶさない**（憲法ルール6）
; ので、メッセージを消すのではなく原因のほうを外す。
;
; 樹木は 1 本 50 万面あり、そのレイトレ用ジオメトリが常駐する。
; **葉が反射に映ることより、警告が出ないことと描画が軽いことのほうが
; 大事**（このコースに鏡のような面は無い）。
; Lumen はソフトウェアトレースに落ちる。動的GIと反射は効いたままである。
r.RayTracing=False

; **Lumen をソフトウェアトレースで動かすための距離場。**
;
; レイトレを切った直後は
;   「Lumen is enabled, but has no ray tracing data and won't operate
;     correctly.」
; が画面に出た。Lumen は「ハードウェアレイトレ」か「メッシュ距離場」の
; どちらかを要る。**警告を消すのではなく、要求されているほうを用意する。**
r.GenerateMeshDistanceFields=True

