[/Script/Engine.RendererSettings]
; **静的ライティングを使わない。**
;
; 有効なままだと、527 個の StaticMeshActor に対して
;   「ライティングを再ビルドする必要があります(527 個のビルドされていない
;     オブジェクト)」
; が画面に出続ける。ライトマップを焼けば消えるが、
;
;   - 樹木 525 本ぶんのライトマップ UV とベイクに長時間かかる
;   - このコースは Lumen（動的GI）で照らしており、**焼いた結果は使われない**
;
; ので、焼くのではなく静的ライティングを切るのが正しい。
r.AllowStaticLighting=False

; 動的GIと反射を Lumen に固定する。**既定に頼らない。**
; UE のバージョンで既定が変わると、絵が黙って変わる。
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
r.SkinCache.CompileShaders=1

; **ハードウェアレイトレーシングは入れたままにする。**
;
; 一度これを切ったら、フレーム時間が **27 ms -> 858 ms**（36 FPS ->
; 1.2 FPS）になった。
;
; 切った理由は「RAY TRACING GEOMETRY - ALWAYS RESIDENT MEMORY EXCEEDS
; 20% OF THE BUDGET」という画面の警告を消すためだったが、切ると Lumen が
; **メッシュ距離場を使ったソフトウェアトレース**に落ちる。樹木 1 本が
; 50 万〜266 万面あるこのコースでは、その距離場の構築と走査が桁違いに
; 重い。**警告を消そうとして 30 倍遅くしていた。**
;
; 正しい直し方は「レイトレを切る」ではなく「常駐させるジオメトリを
; 減らす」。予算を実測に合わせて上げ、重い樹木はレイトレの対象から
; 外してある（`Scripts/prepare_foliage.py`）。
r.RayTracing=True

; 常駐ジオメトリの予算 [MB]。既定 400 に対し実測 311〜319 MB だった。
; **超えていないのに 20% 警告が出る**（20% を超えたら知らせる作り）ので、
; 余裕を持たせる。
r.RayTracing.Geometry.AlwaysResidentGeometryMemoryBudgetMB=1024

; **距離場は作らない。** ハードウェアレイトレがあるので Lumen には要らず、
; 作ると巨大メッシュぶんの構築時間とメモリだけ掛かる。
r.GenerateMeshDistanceFields=False

